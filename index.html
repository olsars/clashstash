<!DOCTYPE html>
<html lang="en-US">


<head> <title> Clash Stash</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>

<body>
    
<h1 style="font-size: 42px" > Clash Stash </h1>

<p> Created to keep track of match history, and keep data such as decks,
    score and losing streaks.
</p>

<h2 style="font-size: 22px">Add Match</h2>
<form id="add-match-form" action="/placeholder" method="post">
    <p>
        <label for="date"> Date: </label>
        <input type="date" id="date" name="date" required>
    </p>
    <p>
        <label for="player1"> Player 1: </label>
        <select id="player1" name="player1" required>
        <option value="Sam"> Sam </option>
        <option value="Tai"> Tai </option>
        </select>
    </p>
   <p>
        <label for="player2"> Player 2: </label>
        <select id="player2" name="player2" required>
        <option value="Sam"> Sam </option>
        <option value="Tai"> Tai </option>
        </select>
    </p>
    <p>
        <label for="Score1"> Player 1 Score: </label>
        <input type="number" id="Score1" name="Score1" 
        min="0" max="3" required>
    </p>
    <p>
        <label for="Score2"> Player 2 Score: </label>
        <input type="number" id="Score2" name="Score2"
        min="0" max="3" required>
    </p>
    <button>Submit Match</button>
</form>


<h2 style="font-size: 22px">Recent Matches</h2>
<table>
    <thead>
    <tr>
        
        <th>Date</th>
        <th>Player 1</th>
        <th>Player 2</th>
        <th>Score</th>
        <th>Winner</th>
    </tr>
    </thead>

    <tbody id="match-history">
    <tr>
        <td>9-28-26</td>
        <td>Sam</td>
        <td>Tai</td>
        <td>2-1</td>
        <td>Sam</td>
    </tr>
    <tr>
        <td>9-28-26</td>
        <td>Sam</td>
        <td>Tai</td>
        <td>3-0</td>
        <td>Sam</td>
    </tr>
    </tbody>
</table>
</body>

</html>
